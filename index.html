<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#163d32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>المكتبة السنية — al Maktabah as Sunniyyah</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23163d32'/%3E%3Cpath d='M32 19c-7-5-15-5-23-2v31c8-3 16-3 23 2 7-5 15-5 23-2V17c-8-3-16-3-23 2zm0 0v31' fill='none' stroke='%23f3e8c9' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #163d32;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #frame-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      border: none;
      z-index: 1;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: #163d32;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 9999;
      color: #efe6c9;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(239, 230, 201, 0.2);
      border-top-color: #efe6c9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .title-ar {
      font-size: 20px;
      font-family: Georgia, "Times New Roman", serif;
      letter-spacing: 0.05em;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div class="title-ar">المكتبة السنية</div>
  </div>

  <div id="frame-container">
    <iframe
      id="maktab-frame"
      src="https://maktab.my.id"
      title="al Maktabah as Sunniyyah"
      allow="clipboard-read; clipboard-write; fullscreen"
      allowfullscreen
      onload="hideLoader()"
    ></iframe>
  </div>

  <script>
    function hideLoader() {
      const overlay = document.getElementById('loading-overlay');
      if (overlay) {
        overlay.style.opacity = '0';
        setTimeout(() => {
          overlay.style.visibility = 'hidden';
          overlay.remove();
        }, 300);
      }
    }
    // Fallback: sembunyikan loader setelah 5 detik jika event onload terhambat
    setTimeout(hideLoader, 5000);
  </script>

  <noscript>
    <div style="padding: 20px; color: #fff; text-align: center;">
      Browser Anda tidak mendukung iframe. Silakan buka langsung <a href="https://maktab.my.id" style="color: #efe6c9;">maktab.my.id</a>.
    </div>
  </noscript>
</body>
</html>
